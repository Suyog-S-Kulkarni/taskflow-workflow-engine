# Isolated test database
spring.datasource.url=jdbc:mysql://localhost:3306/flowforge_test?connectionTimeZone=UTC
spring.datasource.username=flowforge_test_app
spring.datasource.password=${FLOWFORGE_TEST_DB_PASSWORD}

# Smaller test connection pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Validate mappings and run the same migrations
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.sql.init.mode=never